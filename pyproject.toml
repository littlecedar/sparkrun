[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrun"
version = "0.4.2"
description = "Launch and manage Docker-based inference workloads on NVIDIA DGX Spark systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/sparkrun/plugins/*/LICENSE", "src/sparkrun/orchestration/executors/seccomp/LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Clustering",
]
dependencies = [
    "scitrera-app-framework==0.0.69",
    "vpd==0.9.13",
    "six==1.17.0", # transitive dependency of vpd but we pin the version for security reasons
    "idna==3.15", # transitive (requests/huggingface-hub) pinned to the CVE-2026-45409 fix
    "pygments==2.20.0", # transitive (rich/textual) pinned to the CVE-2026-4539 fix
    "click==8.4.2",
    "pyyaml==6.0.3",
    "packaging==26.0", # PEP 440 comparison for recipe minimum core versions
    "huggingface-hub==2.2.0",
    "textual==8.2.5",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "starlette==1.7.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "anyio==4.12.1",
    "h11==0.16.0",
    "annotated-types==0.8.0",
    "typing-inspection==0.4.4",
    "opentelemetry-api==1.45.1",
    "psutil==7.2.2", # portable process creation identities and descendant cleanup
    "pywin32==312; sys_platform == 'win32'", # native ACLs and worker Job Objects

]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pyright[nodejs]==1.1.414",
    "pytest-timeout==2.4.0",
]

[project.scripts]
sparkrun = "sparkrun.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sparkrun.plugins.oci_relay" = ["LICENSE", "COPYRIGHT", "README.md", "VENDORED.toml", "releases.json"]
"sparkrun" = ["py.typed"]
"sparkrun.scripts" = ["*.sh"]
"sparkrun.orchestration.executors" = ["seccomp/*.json", "seccomp/LICENSE", "seccomp/README.md"]
"sparkrun.plugins.lil" = ["LICENSE", "bases.yaml"]
"sparkrun.bin" = ["nv-monitor-*", "prom2json-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Wall-clock cap per test (pytest-timeout). The point is hang detection —
# an SSH probe into a black hole, a readiness watcher that never returns —
# not pacing slow tests, so it is set far above the slowest legitimate test
# (the full-range port scan) with head room for slower CI runners. Signals
# on POSIX, threads on Windows (the plugin's platform default).
timeout = 120
# Dump tracebacks of anything still running at 60s before the cap kills it,
# so a timeout in CI ships with the stack that caused it.
faulthandler_timeout = 60

[tool.ruff]
line-length = 140
target-version = "py312"
required-version = "==0.16.6"
# Vendor snapshots are immutable, including when hooks pass explicit filenames.
extend-exclude = ["src/sparkrun/plugins/oci_relay", "tests/vendor/oci_relay"]
force-exclude = true

[tool.ruff.format]
# Documentation includes partial Python examples; its own contract tests check
# syntax/imports without rewriting excerpts as standalone programs.
exclude = ["*.md"]

[tool.ruff.lint]
# ruff's default set (E4/E7/E9/F) plus flake8-bugbear.  B is enforced rather
# than merely available because its three recurring findings here are each a
# silent failure: an unchained `raise` inside `except` loses the traceback that
# names the real cause, and a `zip()` without `strict=` truncates to the shorter
# input rather than reporting the skew.  Keeping it green means every new
# `zip()` states which it wants.
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-timeout>=2.4",
    "ruff==0.16.6",
    "pyright[nodejs]==1.1.414",
    "httpx2>=2.0.0",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
